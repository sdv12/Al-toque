# Netlify — Landing Kit (Next.js 16)
[build]
  command = "pnpm build"
  publish = ".next"

[build.environment]
  NODE_VERSION = "22"

[[plugins]]
  package = "@netlify/plugin-nextjs"

# El dominio viejo de Netlify redirige al propio (links ya compartidos incluidos).
[[redirects]]
  from = "https://landing-al-toque.netlify.app/*"
  to = "https://altoque-cba.com.ar/:splat"
  status = 301
  force = true

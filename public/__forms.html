<!doctype html>
<!--
  Declaración de los formularios para Netlify Forms. Con @netlify/plugin-nextjs v5 los forms
  tienen que existir en un HTML estático de public/ para que Netlify los detecte al deployar,
  y el envío se hace con un POST a este archivo (ver src/app/(sitio)/(kit)/pedido.ts). Nadie navega acá.
  "subject" es el asunto del mail de aviso ("Pedido #00015 · Landing · Negocio").
-->
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <title>Formularios</title>
  </head>
  <body>
    <form name="configuraciones" method="POST" netlify netlify-honeypot="bot-field" hidden>
      <input type="hidden" name="form-name" value="configuraciones" />
      <input type="hidden" name="subject" />
      <input name="bot-field" />
      <input name="numero" />
      <input name="tipo" />
      <input name="negocio" />
      <input name="detalle" />
      <input name="estimado" />
      <input name="slug" />
      <textarea name="configuracion"></textarea>
      <textarea name="codigo"></textarea>
    </form>
    <!-- Botón de arrepentimiento (Res. SCI 424/2020) y botón de baja (Ley 24.240, art. 10 ter). -->
    <form name="arrepentimiento" method="POST" netlify netlify-honeypot="bot-field" hidden>
      <input type="hidden" name="form-name" value="arrepentimiento" />
      <input type="hidden" name="subject" />
      <input name="bot-field" />
      <input name="codigo" />
      <input name="nombre" />
      <input name="contacto" />
      <input name="pedido" />
      <input name="servicio" />
      <input name="fecha" />
      <textarea name="motivo"></textarea>
    </form>
    <form name="baja" method="POST" netlify netlify-honeypot="bot-field" hidden>
      <input type="hidden" name="form-name" value="baja" />
      <input type="hidden" name="subject" />
      <input name="bot-field" />
      <input name="codigo" />
      <input name="nombre" />
      <input name="contacto" />
      <input name="pedido" />
      <input name="servicio" />
      <input name="fecha" />
      <textarea name="motivo"></textarea>
    </form>
    <!-- Lista de espera de Al Toque Tienda (para medir la demanda antes de construirla). -->
    <form name="tienda" method="POST" netlify netlify-honeypot="bot-field" hidden>
      <input type="hidden" name="form-name" value="tienda" />
      <input type="hidden" name="subject" />
      <input name="bot-field" />
      <input name="nombre" />
      <input name="contacto" />
      <input name="negocio" />
      <input name="vende" />
      <input name="productos" />
      <input name="hoy" />
      <textarea name="comentario"></textarea>
    </form>
  </body>
</html>
